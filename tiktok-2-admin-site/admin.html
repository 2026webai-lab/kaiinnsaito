<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>管理画面</title>
<link rel="stylesheet" href="style.css">
<style>
.bar{display:flex;gap:8px;margin:12px 0}.bar input{flex:2}.bar select{flex:1}.bar input,.bar select{min-width:0}
.row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;cursor:pointer}
.row .tag{margin-left:6px}
dialog{border:0;border-radius:12px;width:92%;max-width:560px;padding:20px;color:var(--ink)}
dialog::backdrop{background:rgba(18,22,43,.5)}
</style></head><body>
<div class="w"><h1>管理画面</h1>

<form id="lf" class="panel">
<label>メールアドレス<input id="em" type="email" required autocomplete="username"></label>
<label>パスワード<input id="pw" type="password" required autocomplete="current-password"></label>
<button class="btn" style="margin-top:16px">ログイン</button>
<p id="lm" class="err" role="status"></p></form>

<div id="mfa" class="panel" hidden></div>
<div id="app" hidden>
<div class="bar"><input id="q" type="search" placeholder="名前・TikTok ID・コードで検索"><select id="sf" aria-label="状態"><option value="">すべて</option></select></div>
<p id="cnt" class="mut"></p><div id="list"></div>
<p><a class="btn sub" href="jobs.html">仕事・応募の管理へ</a></p>
<p><button id="out" class="btn sub">ログアウト</button></p></div>

<dialog id="dlg"><div id="dt"></div>
<label>状態<select id="ds"></select></label>
<label>フォロワー数（手入力）<input id="df" type="number" min="0"></label>
<label>メモ<textarea id="dn" rows="4" maxlength="2000"></textarea></label>
<button id="sv" type="button" class="btn" style="margin-top:14px">保存</button>
<button id="cl" type="button" class="btn sub" style="margin-top:8px">閉じる</button>
<button id="del" type="button" class="btn sub" style="margin-top:8px;color:var(--err)">完全に削除</button></dialog></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
<script src="config.js"></script>
<script src="admin-auth.js"></script>
<script>
const ST=['新規','確認中','承認','稼働中','休止','退会'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[],cur=null;
$('ds').innerHTML=ST.map(s=>`<option>${s}</option>`).join('');
$('sf').innerHTML+=ST.map(s=>`<option>${s}</option>`).join('');

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  $('lf').hidden=!!session;$('app').hidden=true;$('mfa').hidden=true;
  if(session&&await mfaOk($('mfa'))){$('app').hidden=false;load()}
}
$('lf').onsubmit=async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  $('lm').textContent=error?'ログインできませんでした。':'';
  if(!error){$('pw').value='';init()}
};
$('out').onclick=async()=>{await sb.auth.signOut();rows=[];init()};

async function load(){
  const {data,error}=await sb.from('members').select('*').order('created_at',{ascending:false});
  if(error){$('cnt').textContent='読み込めませんでした。管理者として登録されているか確認してください。';return}
  rows=data;draw();
}
function draw(){
  const q=$('q').value.trim().toLowerCase(),s=$('sf').value;
  const v=rows.filter(r=>(!s||r.status===s)&&(!q||[r.code,r.nickname,r.tiktok_id,r.line_name].join(' ').toLowerCase().includes(q)));
  $('cnt').textContent=v.length+'件（全'+rows.length+'件）';
  $('list').innerHTML=v.map(r=>`<div class="row" data-id="${esc(r.id)}"><strong>${esc(r.nickname)}</strong><span class="tag">${esc(r.status)}</span><br><small>@${esc(r.tiktok_id)}／LINE：${esc(r.line_name)}／コード ${esc(r.code)}／${esc(r.created_at.slice(0,10))}</small></div>`).join('')||'<p class="mut">該当する登録者はいません。</p>';
}
$('q').oninput=draw;$('sf').onchange=draw;
$('list').onclick=e=>{const c=e.target.closest('.row');if(c)openDetail(c.dataset.id)};

function openDetail(id){
  cur=rows.find(x=>x.id===id);if(!cur)return;
  $('dt').innerHTML=`<h2>${esc(cur.nickname)}</h2><p>
    TikTok：<a href="https://www.tiktok.com/@${encodeURIComponent(cur.tiktok_id)}" target="_blank" rel="noopener">@${esc(cur.tiktok_id)}</a><br>
    LINE名：${esc(cur.line_name)}<br>
    得意なこと：${esc(cur.skills||'—')}<br>
    対応時間の目安：${esc(cur.availability||'—')}<br>
    登録コード：<strong>${esc(cur.code)}</strong>／登録日：${esc(cur.created_at.slice(0,10))}<br>最終ログイン：${cur.last_login_at?esc(new Date(cur.last_login_at).toLocaleString('ja-JP')):'—'}</p>`;
  $('ds').value=cur.status;$('df').value=cur.followers??'';$('dn').value=cur.note||'';
  $('dlg').showModal();
}
$('cl').onclick=()=>$('dlg').close();
$('sv').onclick=async()=>{
  const {error}=await sb.from('members').update({status:$('ds').value,followers:$('df').value===''?null:Number($('df').value),note:$('dn').value||null}).eq('id',cur.id);
  if(error){alert('保存できませんでした。');return}
  $('dlg').close();load();
};
$('del').onclick=async()=>{
  if(!confirm('この登録者を完全に削除します。元に戻せません。よろしいですか？'))return;
  const {error}=await sb.from('members').delete().eq('id',cur.id);
  if(error){alert('削除できませんでした。');return}
  $('dlg').close();load();
};
init();
</script></body></html>
